name: Search Console — relevé
on:
  schedule:
    - cron: '7 5 * * *'
    - cron: '7 17 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency: search-console
jobs:
  releve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: _gsc
      - name: Vérifier les secrets
        id: check
        env:
          GSC_SA_KEY: ${{ secrets.GSC_SA_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$GSC_SA_KEY" ] || [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Secrets pas encore ajoutés : relevé ignoré."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.check.outputs.ready == 'true'
        with:
          python-version: '3.12'
      - name: Installer
        if: steps.check.outputs.ready == 'true'
        run: pip install --quiet google-auth==2.35.0 requests==2.32.3
      - name: Relever Search Console
        if: steps.check.outputs.ready == 'true'
        env:
          GSC_SA_KEY: ${{ secrets.GSC_SA_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python _gsc/releve.py
