<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merci pour votre commande — SLP</title>
<style>
  :root{ --ink:#0c0a14; --paper:#f7f5f0; --muted:#a9a4bc; --amber:#fc8024; }
  body{background:var(--ink); color:var(--paper); font-family:'Instrument Sans',sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:24px;}
  h1{font-family:'League Spartan',sans-serif; font-size:2.2rem; margin-bottom:14px;}
  p{color:var(--muted); margin-bottom:24px;}
  a{color:var(--amber); text-decoration:none; font-weight:600;}
</style>
<link rel="preload" href="/fonts/league-spartan-latin-900-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/charte.css">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#0C0A14">
</head>
<body>
  <div>
    <h1>Merci pour votre commande !</h1>
    <p>Votre paiement a bien été enregistré. Un email de confirmation vous sera envoyé sous peu.</p>
    <a href="index.html">← Retour à l'accueil</a>
  </div>
</body>
<script>
(function(){
  // Ne compte pas les visites faites depuis un navigateur où l'admin est connecté
  // (même origine soundlightprod.fr donc même localStorage) : évite de polluer les
  // stats avec tes propres passages sur le site pendant que tu es dans l'admin.
  if (localStorage.getItem('slp_admin_token')) return;
  // Un même identifiant de session (par onglet) pour reconstituer le parcours de visite
  var sid = sessionStorage.getItem('slp_visit_sid');
  if (!sid){ sid = Date.now().toString(36) + Math.random().toString(36).slice(2); sessionStorage.setItem('slp_visit_sid', sid); }
  (function(){try{if(/[?&]notrack=1/.test(location.search))localStorage.setItem("slp_notrack","1");if(/[?&]notrack=0/.test(location.search))localStorage.removeItem("slp_notrack");if(localStorage.getItem("slp_notrack"))return Promise.resolve();}catch(e){}return fetch.apply(window,arguments);})("https://slp-api.raspy-silence-d4c7.workers.dev/api/track-visit", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ artist_slug: "boutique-merci", session_id: sid, ref:(function(){try{var q=new URLSearchParams(location.search),s=q.get("utm_source")||(q.get("utm_medium")==="email"?"email":"");if(s){var c=(q.get("utm_campaign")||"").toLowerCase().normalize("NFD").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,50);return "https://emailing-"+s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"")+(c?"."+c:"")+"/";}}catch(e){}return document.referrer;})() })
  }).catch(function(){});
})();
</script>
</html>
