name: Boutique — pages produit
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['_boutique/**', 'boutique.html']
permissions:
  contents: write
concurrency: boutique
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Générer les pages produit depuis le catalogue
        run: python3 _boutique/build.py
      - name: Enregistrer les changements
        run: |
          git config user.name "slp-boutique-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A produits boutique.html sitemap.xml
          if git diff --cached --quiet; then echo "Rien à mettre à jour"; exit 0; fi
          git commit -m "Boutique : pages produit mises à jour depuis le catalogue"
          git push
