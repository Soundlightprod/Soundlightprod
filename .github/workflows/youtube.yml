name: YouTube — relevé
on:
  schedule:
    - cron: '12 5 * * *'
    - cron: '12 17 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency: youtube
jobs:
  releve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /_yt/
            /*.html
            /en/*.html
            /es/*.html
            /it/*.html
      - name: Vérifier les secrets
        id: check
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$YT_API_KEY" ] || [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Secret YT_API_KEY pas encore ajouté : relevé ignoré."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.check.outputs.ready == 'true'
        with:
          python-version: '3.12'
      - name: Installer
        if: steps.check.outputs.ready == 'true'
        run: pip install --quiet requests==2.32.3
      - name: Relever YouTube
        if: steps.check.outputs.ready == 'true'
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python _yt/releve.py
