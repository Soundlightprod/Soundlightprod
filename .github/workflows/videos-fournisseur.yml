name: Vidéos fournisseur (à mettre sur YouTube)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  videos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Télécharger les vidéos (hors dépôt)
        run: |
          mkdir -p videos
          python3 - <<'PY'
          import json, urllib.request, pathlib
          base = 'https://shopcdnalpha.grainajz.com/'
          for slug, path in json.load(open('_boutique/videos_fournisseur.json')).items():
              req = urllib.request.Request(base + path, headers={'User-Agent': 'Mozilla/5.0 slp-boutique'})
              try:
                  data = urllib.request.urlopen(req, timeout=120).read()
                  pathlib.Path('videos', slug + '.mp4').write_bytes(data)
                  print(f'{slug}.mp4  {len(data)/1e6:.1f} Mo')
              except Exception as e:
                  print('ÉCHEC', slug, e)
          PY
          ls -la videos
      - uses: actions/upload-artifact@v4
        with:
          name: videos-fournisseur
          path: videos/
          retention-days: 14
