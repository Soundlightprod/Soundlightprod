<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>SLP Stats</title>
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="stats-manifest.json">
<meta name="theme-color" content="#0c0b10">
<link rel="icon" href="admin-icon-192.png?v=20261010">
<link rel="apple-touch-icon" href="admin-icon-180.png?v=20261010">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SLP Stats">
<style>
  :root{ --ink:#0c0b10; --ink-2:#17151e; --paper:#f5f2ec; --muted:#9a93a6; --amber:#ffb238; --pink:#ff4d7d; --violet:#8b5cf6; --blue:#2f9bff; --green:#6ee7a0; --line:rgba(255,255,255,.1); }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; background:var(--ink); color:var(--paper); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;}
  body{padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 86px); min-height:100vh; -webkit-text-size-adjust:100%;}
  header{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
  h1{margin:0; font-size:1.35rem; font-weight:800; background:linear-gradient(90deg,#2f9bff,#8b5cf6,#ff4d7d,#ffb238); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .upd{font-size:.72rem; color:var(--muted);} .upd button{background:none; border:0; color:var(--blue); font-size:1.05rem; padding:4px 0 4px 10px;}
  .chips{display:flex; gap:8px; overflow-x:auto; padding-bottom:10px; margin-bottom:4px; scrollbar-width:none;} .chips::-webkit-scrollbar{display:none;}
  .chip{flex:0 0 auto; border:1px solid var(--line); background:var(--ink-2); color:var(--muted); border-radius:20px; padding:8px 14px; font-size:.85rem; font-weight:600;}
  .chip.on{background:linear-gradient(90deg,#2f9bff,#8b5cf6); color:#fff; border-color:transparent;}
  .kpis{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px;}
  .kpi{background:var(--ink-2); border:1px solid var(--line); border-radius:16px; padding:14px 14px 12px; position:relative; overflow:hidden;}
  .kpi::before{content:''; position:absolute; left:0; right:0; top:0; height:3px; background:linear-gradient(90deg,#3259BE,#8C3290,#FF0953,#FC8024,#FBC608);}
  .kpi .k{display:block; font-size:.66rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-bottom:4px;}
  .kpi b{display:block; font-size:2.1rem; font-weight:800; line-height:1.05;}
  .kpi .d{display:block; font-size:.75rem; color:var(--muted); margin-top:3px;}
  .up{color:var(--green)!important;} .down{color:#f87171!important;}
  .card{background:var(--ink-2); border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:12px;}
  .card h3{margin:0 0 10px; font-size:.78rem; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); font-weight:700; display:flex; justify-content:space-between; gap:8px;}
  .card h3 span{text-transform:none; letter-spacing:0; font-weight:500;}
  .row{display:grid; grid-template-columns:1fr auto; gap:2px 10px; align-items:center; padding:7px 0; border-top:1px solid var(--line);} .row:first-of-type{border-top:0;}
  .row .n{font-size:.92rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;} .row .v{font-weight:700; color:var(--blue); font-variant-numeric:tabular-nums;}
  .row .bar{grid-column:1/-1; height:4px; border-radius:2px; background:rgba(255,255,255,.07); overflow:hidden;} .row .bar i{display:block; height:100%; background:linear-gradient(90deg,#2f9bff,#8b5cf6);}
  .row .s{grid-column:1/-1; font-size:.72rem; color:var(--muted);}
  .seg{display:flex; background:var(--ink); border:1px solid var(--line); border-radius:10px; padding:3px; margin-bottom:12px;}
  .seg button{flex:1; border:0; background:none; color:var(--muted); padding:7px 0; border-radius:8px; font-size:.82rem; font-weight:600;} .seg button.on{background:var(--ink-2); color:#fff;}
  ul.res{margin:0; padding-left:18px; font-size:.9rem; line-height:1.5;} ul.res li{margin-bottom:4px;}
  .pill{display:inline-block; font-size:.7rem; padding:3px 9px; border-radius:20px; background:rgba(47,155,255,.15); color:var(--blue); margin:2px 4px 0 0;} .pill.bad{background:rgba(255,77,125,.15); color:var(--pink);} .pill.ok{background:rgba(110,231,160,.15); color:var(--green);}
  .empty,.err{color:var(--muted); font-size:.88rem; padding:6px 0;} .err{color:var(--pink);}
  nav{position:fixed; left:0; right:0; bottom:0; display:flex; background:rgba(23,21,30,.94); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-top:1px solid var(--line); padding:6px 8px calc(env(safe-area-inset-bottom) + 6px);}
  nav button{flex:1; background:none; border:0; color:var(--muted); font-size:.68rem; font-weight:600; padding:6px 0; display:flex; flex-direction:column; align-items:center; gap:2px;} nav button span{font-size:1.25rem;} nav button.on{color:#fff;}
  .pane{display:none;} .pane.on{display:block;}
  #login{max-width:360px; margin:18vh auto 0; text-align:center;} #login input{width:100%; padding:14px; border-radius:12px; border:1px solid var(--line); background:var(--ink-2); color:var(--paper); font-size:1rem; margin:14px 0 10px;} #login button{width:100%; padding:14px; border:0; border-radius:12px; font-weight:700; font-size:1rem; color:#fff; background:linear-gradient(90deg,#2f9bff,#8b5cf6);}
  .hide{display:none!important;}
  body.full{padding:0;} body.full header,body.full #chips{display:none;}
  #pane-admin{position:fixed; left:0; right:0; top:0; bottom:calc(env(safe-area-inset-bottom) + 58px); background:var(--ink);}
  #pane-admin iframe{width:100%; height:100%; border:0; display:block; background:var(--ink); padding-top:env(safe-area-inset-top);}
</style>
</head>
<body>
<div id="login" class="hide">
  <h1 style="font-size:1.8rem">SLP Stats</h1>
  <input id="pw" type="password" placeholder="Mot de passe admin" autocomplete="current-password">
  <button id="loginBtn">Entrer</button>
  <div id="loginErr" class="err"></div>
</div>

<div id="app" class="hide">
  <header><h1>SLP Stats</h1><div class="upd"><span id="upd">…</span><button id="refresh" aria-label="Actualiser">↻</button></div></header>
  <div class="chips" id="chips"></div>

  <section class="pane on" id="pane-today">
    <div class="kpis" id="kpis"></div>
    <div class="card"><h3>Lieux des visites <span id="cityNote"></span></h3><div id="cities"></div></div>
    <div class="card"><h3>Appareils</h3><div id="devices"></div></div>
    <div class="card"><h3>Provenance</h3><div id="refs"></div></div>
  </section>

  <section class="pane" id="pane-lieux">
    <div class="seg" id="periodSeg"><button data-p="today" class="on">Aujourd'hui</button><button data-p="week">7 jours</button><button data-p="month">30 jours</button></div>
    <div class="card"><h3>Villes <span id="lTotal"></span></h3><div id="lCities"></div></div>
    <div class="card"><h3>Régions</h3><div id="lRegions"></div></div>
    <div class="card"><h3>Pays</h3><div id="lCountries"></div></div>
    <div class="card"><h3>Réseaux</h3><div id="lNets"></div></div>
  </section>

  <section class="pane" id="pane-admin"></section>

  <section class="pane" id="pane-rapports">
    <div class="card"><h3>Dernier rapport <span id="rapDate"></span></h3><div id="rapport"></div></div>
    <div class="card"><h3>Visiteurs à suivre <span>3 pages ou plus</span></h3><div id="prospects"></div></div>
    <div class="card"><h3>Campagnes mail</h3><div id="campagnes"></div></div>
  </section>
</div>

<nav id="nav" class="hide">
  <button data-t="today" class="on"><span>📊</span>Aujourd'hui</button>
  <button data-t="lieux"><span>📍</span>Lieux</button>
  <button data-t="rapports"><span>📝</span>Rapports</button>
  <button data-t="admin"><span>⚙️</span>Admin</button>
</nav>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const SITES = [['slp','SLP'],['bmb','Book My Band'],['csa','CS Animations'],['store','Boutique']];
  let token = ''; try { token = localStorage.getItem('slp_admin_token') || sessionStorage.getItem('slp_admin_token') || ''; } catch (e) {}
  let site = 'slp', period = 'today', tab = 'today', busy = false, meteo = null;
  try { site = localStorage.getItem('slp_stats_site') || 'slp'; } catch (e) {}
  const fmt = (n) => (n == null ? '—' : Number(n).toLocaleString('fr-FR'));
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

  async function api(path) {
    const r = await fetch(path, { headers: { Authorization: 'Bearer ' + token } });
    if (r.status === 401) { const e = new Error('401'); e.auth = true; throw e; }
    if (!r.ok) throw new Error('Erreur ' + r.status);
    return r.json();
  }

  function rows(box, list, note) {
    box.replaceChildren();
    const l = (list || []).filter((x) => x.label && x.label !== 'Inconnu');
    if (!l.length) { box.appendChild(el('div', 'empty', 'Rien pour l’instant.')); return; }
    const max = Math.max(...l.map((x) => x.total));
    l.forEach((x) => {
      const r = el('div', 'row'); r.append(el('div', 'n', x.label), el('div', 'v', fmt(x.total)));
      const b = el('div', 'bar'), i = el('i'); i.style.width = Math.max(3, 100 * x.total / max) + '%'; b.appendChild(i); r.appendChild(b);
      box.appendChild(r);
    });
  }

  function delta(cur, prev, label) {
    const d = el('span', 'd'); const diff = (cur || 0) - (prev || 0);
    d.textContent = label + ' ' + fmt(prev) + (diff > 0 ? '  ▲ +' + diff : diff < 0 ? '  ▼ ' + diff : '');
    if (diff > 0) d.classList.add('up'); else if (diff < 0) d.classList.add('down');
    return d;
  }
  function kpi(k, v, d) { const c = el('div', 'kpi'); c.append(el('span', 'k', k), el('b', null, v)); if (d) c.appendChild(typeof d === 'string' ? el('span', 'd', d) : d); return c; }

  async function loadToday() {
    const [m, b] = await Promise.all([meteo ? Promise.resolve(meteo) : api('/api/admin/meteo'), api('/api/admin/visits-breakdown?period=today&site=' + site)]);
    meteo = m;
    const s = (m.sites || []).find((x) => x.site === site) || {};
    const k = $('kpis'); k.replaceChildren(
      kpi('Visiteurs', fmt(s.aujourdhui), delta(s.aujourdhui, s.hier, 'hier')),
      kpi('Pages vues', fmt(s.pages_aujourdhui), delta(s.pages_aujourdhui, s.pages_hier, 'hier')),
      kpi('7 jours', fmt(s.sept_jours), delta(s.sept_jours, s.sept_jours_avant, 'avant')),
      kpi('Retours', fmt(b.retours ? b.retours.revenus : null), b.retours ? fmt(b.retours.identifies) + ' identifiés' : '')
    );
    $('cityNote').textContent = fmt(b.total) + ' pages';
    rows($('cities'), (b.by_city || []).slice(0, 8));
    rows($('devices'), (b.by_device || []).slice(0, 4));
    rows($('refs'), (b.by_referrer || []).slice(0, 6));
  }

  async function loadLieux() {
    const b = await api('/api/admin/visits-breakdown?period=' + period + '&site=' + site);
    $('lTotal').textContent = fmt(b.total) + ' pages';
    rows($('lCities'), (b.by_city || []).slice(0, 15));
    rows($('lRegions'), (b.by_region || []).slice(0, 8));
    rows($('lCountries'), (b.by_country || []).slice(0, 8));
    rows($('lNets'), (b.by_network || []).slice(0, 6));
  }

  function listOf(raw) { try { const v = typeof raw === 'string' ? JSON.parse(raw || '[]') : raw; return Array.isArray(v) ? v : []; } catch (e) { return []; } }
  const asText = (x) => (typeof x === 'string' ? x : x && (x.texte || x.titre || x.action || x.label || JSON.stringify(x)));

  async function loadRapports() {
    const m = meteo || (meteo = await api('/api/admin/meteo'));
    const r = m.rapport, box = $('rapport'); box.replaceChildren();
    if (!r) { box.appendChild(el('div', 'empty', 'Le premier rapport arrivera vers 7h50.')); $('rapDate').textContent = ''; }
    else {
      $('rapDate').textContent = (r.moment || '') + ' · ' + (r.cree_le || '').slice(0, 10);
      if (r.titre) { const t = el('div', null, r.titre); t.style.cssText = 'font-weight:700;margin-bottom:8px'; box.appendChild(t); }
      const res = listOf(r.resume_json); if (res.length) { const ul = el('ul', 'res'); res.forEach((x) => ul.appendChild(el('li', null, asText(x)))); box.appendChild(ul); }
      const act = listOf(r.actions_json);
      if (act.length) { const h = el('div', 'upd', 'À faire'); h.style.cssText = 'margin:10px 0 4px;text-transform:uppercase;letter-spacing:.07em'; box.appendChild(h); const ul = el('ul', 'res'); act.forEach((x) => ul.appendChild(el('li', null, asText(x)))); box.appendChild(ul); }
    }
    const p = $('prospects'); p.replaceChildren();
    const pr = m.prospects || [];
    if (!pr.length) p.appendChild(el('div', 'empty', 'Aucun visiteur à suivre hier ou aujourd’hui.'));
    pr.slice(0, 8).forEach((v) => {
      const row = el('div', 'row'); row.append(el('div', 'n', (v.ville || 'Lieu inconnu') + (v.pays && v.pays !== 'FR' ? ' (' + v.pays + ')' : '')), el('div', 'v', fmt(v.pages) + ' p.'));
      row.appendChild(el('div', 's', [v.appareil, v.reseau, v.provenance].filter(Boolean).join(' · ') + (v.sessions_14j > 1 ? ' · ' + v.sessions_14j + ' visites en 14 j' : '')));
      p.appendChild(row);
    });
    const c = $('campagnes'); c.replaceChildren();
    const camps = m.brevo || [];
    if (!camps.length) c.appendChild(el('div', 'empty', 'Aucune campagne relevée.'));
    camps.slice(0, 4).forEach((x) => {
      const vraies = Math.max(0, (x.ouvreurs || 0) - (x.ouvertures_apple || 0));
      const row = el('div', 'row'); row.append(el('div', 'n', 'n°' + x.id + ' · ' + x.nom), el('div', 'v', fmt(x.envoyes)));
      const s = el('div', 's'); s.append(
        el('span', 'pill ' + (x.statut === 'sent' ? 'ok' : x.statut === 'suspended' ? 'bad' : ''), { sent: 'envoyée', suspended: 'suspendue (quota)', inProcess: 'en cours', queued: 'programmée' }[x.statut] || x.statut),
        el('span', 'pill', 'ouvertures réelles ' + fmt(vraies)), el('span', 'pill', 'clics ' + fmt(x.cliqueurs_reels)), el('span', 'pill', 'visites ' + fmt(x.visites_site)));
      row.appendChild(s); c.appendChild(row);
    });
  }

  async function load(force) {
    if (busy || tab === 'admin') return; busy = true; $('upd').textContent = '…';
    if (force) meteo = null;
    try {
      if (tab === 'today') await loadToday(); else if (tab === 'lieux') await loadLieux(); else await loadRapports();
      $('upd').textContent = new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
    } catch (e) {
      if (e.auth) { showLogin('Session expirée, reconnecte-toi.'); } else $('upd').textContent = 'hors ligne';
    } finally { busy = false; }
  }

  function showLogin(msg) { $('app').classList.add('hide'); $('nav').classList.add('hide'); $('login').classList.remove('hide'); $('loginErr').textContent = msg || ''; }
  function showApp() { $('login').classList.add('hide'); $('app').classList.remove('hide'); $('nav').classList.remove('hide'); load(true); }

  async function doLogin() {
    $('loginErr').textContent = '';
    try {
      const r = await fetch('/api/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: $('pw').value }) });
      const j = await r.json();
      if (!r.ok || !j.token) throw new Error(j.error || 'Mot de passe incorrect');
      token = j.token; try { localStorage.setItem('slp_admin_token', token); } catch (e) {}
      $('pw').value = ''; showApp();
    } catch (e) { $('loginErr').textContent = e.message; }
  }
  $('loginBtn').onclick = doLogin; $('pw').addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });

  function drawChips() {
    const box = $('chips'); box.replaceChildren();
    SITES.forEach(([k, n]) => { const b = el('button', 'chip' + (k === site ? ' on' : ''), n); b.onclick = () => { site = k; try { localStorage.setItem('slp_stats_site', k); } catch (e) {} drawChips(); load(); }; box.appendChild(b); });
  }
  document.querySelectorAll('#nav button').forEach((b) => b.onclick = () => {
    tab = b.dataset.t; document.querySelectorAll('#nav button').forEach((x) => x.classList.toggle('on', x === b));
    document.querySelectorAll('.pane').forEach((p) => p.classList.toggle('on', p.id === 'pane-' + tab));
    $('chips').classList.toggle('hide', tab === 'rapports' || tab === 'admin');
    document.body.classList.toggle('full', tab === 'admin');
    if (tab === 'admin') { const pa = $('pane-admin'); if (!pa.firstChild) { const f = document.createElement('iframe'); f.src = '/admin.html'; f.title = 'Admin SLP'; pa.appendChild(f); } return; }
    load();
  });
  document.querySelectorAll('#periodSeg button').forEach((b) => b.onclick = () => { period = b.dataset.p; document.querySelectorAll('#periodSeg button').forEach((x) => x.classList.toggle('on', x === b)); load(); });
  $('refresh').onclick = () => load(true);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && token) load(true); });
  setInterval(() => { if (!document.hidden && token) load(true); }, 120000);

  drawChips();
  if (token) showApp(); else showLogin();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('admin-sw.js').catch(() => {});
})();
</script>
</body>
</html>
